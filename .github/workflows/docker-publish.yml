name: Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Existing release tag to publish/retry (e.g. v0.1.0); blank only builds'
        type: string
        default: ''
  workflow_call:
    inputs:
      release-tag:
        description: 'Release tag created by Release Please'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ inputs.release-tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require main workflow for publishing
        if: inputs.release-tag != ''
        run: test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Verify package version, tag and changelog
        if: inputs.release-tag != ''
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node scripts/release-version.mjs
      - name: Install pnpm and dependencies
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm typecheck
      - run: pnpm test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      name: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      revision: ${{ steps.image.outputs.revision }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.sha }}
          persist-credentials: false
      - name: Resolve image name and publish policy
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          PUBLISH: ${{ inputs.release-tag != '' }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.test.outputs.version || 'ci' }}
          labels: |
            org.opencontainers.image.version=${{ needs.test.outputs.version }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
      - name: Log in to GHCR
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.image.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            DEBIAN_MIRROR=http://deb.debian.org
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sign:
    needs: [test, image]
    if: inputs.release-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign and verify the published digest
        env:
          IMAGE: ${{ needs.image.outputs.name }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.test.outputs.version }}
          REVISION: ${{ needs.image.outputs.revision }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          reference="$IMAGE@$DIGEST"
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/docker-publish.yml@refs/heads/main"
          cosign sign --yes -a "version=$VERSION" -a "revision=$REVISION" "$reference"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            -a "version=$VERSION" -a "revision=$REVISION" "$reference"
          {
            echo '## Signed release image'
            echo "Version: $VERSION"
            echo "Image: $reference"
            echo "Source revision: $REVISION"
            echo "Signer: $identity"
          } >> "$GITHUB_STEP_SUMMARY"
