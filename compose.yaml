services:
  agentbridge:
    # Build this checkout; no prebuilt application image is pulled.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-node:26.13.0-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://mirrors.aliyun.com}
    init: true
    restart: unless-stopped
    environment:
      FEISHU_APP_NAME: ${FEISHU_APP_NAME:-AgentBridge}
      # Direct binding for an existing published app; leave all blank for QR-code registration.
      # Any non-blank app field requires the other two plus ALLOWED_USERS.
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_BOT_OPEN_ID: ${FEISHU_BOT_OPEN_ID:-}
      # Also accepted in QR mode: overrides the scanning user as the allowed user.
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      # true lets the first-scan confirm page also offer choosing an existing app.
      FEISHU_SELECT_EXISTING_APP: ${FEISHU_SELECT_EXISTING_APP:-false}
      # Container path; intentionally independent of local Node's WORKSPACE_ROOT in .env.
      # To mount a host project here, see docs/deployment.md > 使用宿主机已有项目目录.
      WORKSPACE_ROOT: /data/workspace
      WORKSPACE_PROJECT: ${WORKSPACE_PROJECT:-.}
      TASK_TIMEOUT_MS: ${TASK_TIMEOUT_MS:-7200000}
      TASK_REPLY_MODE: ${TASK_REPLY_MODE:-auto}
      TASK_BACKGROUND_NOTICE_MS: ${TASK_BACKGROUND_NOTICE_MS:-5000}
      SESSION_IDLE_TIMEOUT_MS: ${SESSION_IDLE_TIMEOUT_MS:-14400000}
      # Startup cleanup of expired dedup/task/result/history rows.
      DATA_RETENTION_MS: ${DATA_RETENTION_MS:-2592000000}
      CLAUDE_RUNTIME_CONFIG: ${CLAUDE_RUNTIME_CONFIG:-}
      DATABASE_PATH: /data/bridge/agentbridge.db
      HOME: /home/node
      CLAUDE_CONFIG_DIR: /data/claude
      TZ: ${TZ:-Asia/Shanghai}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      ANTHROPIC_DEFAULT_FABLE_MODEL: ${ANTHROPIC_DEFAULT_FABLE_MODEL:-}
      CLAUDE_CODE_SUBAGENT_MODEL: ${CLAUDE_CODE_SUBAGENT_MODEL:-}
      # Custom CA for gateways with private certificates; blank means unset.
      # Paths must exist inside the container (mount the CA file into the volume).
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-}
      SSL_CERT_DIR: ${SSL_CERT_DIR:-}
    volumes:
      - agent-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
volumes:
  agent-data:
